[project]
name = "eggsim"
version = "1.0.0"
description = "Egg roulette: learning grip force from human touch demonstrations, in MuJoCo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Geoffrey Bian" }]
dependencies = [
    "mujoco==3.17.0",
    "numpy>=1.26",
    "torch>=2.2",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "pillow>=10",
    "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eggsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
